<!DOCTYPE html>
<html lang="tr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haber Detay</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .prose {
            color: currentColor;
        }

        .prose * {
            float: none !important;
            max-width: 100% !important;
            box-sizing: border-box;
        }

        .prose img,
        .prose video,
        .prose figure {
            border-radius: 0.5rem;
            margin: 1.5rem 0;
            width: 100% !important;
            height: auto !important;
            display: block;
            object-fit: cover;
        }

        .prose p {
            margin-bottom: 1.25rem;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .prose h1,
        .prose h2,
        .prose h3,
        .prose h4 {
            font-weight: 800;
            margin-top: 2rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .prose h2 {
            font-size: 1.5rem;
        }

        .prose h3 {
            font-size: 1.25rem;
        }

        .prose ul,
        .prose ol {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        .prose ul {
            list-style-type: disc;
        }

        .prose ol {
            list-style-type: decimal;
        }

        .prose li {
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .prose a {
            color: var(--fallback-p, oklch(var(--p)));
            text-decoration: underline;
            font-weight: 600;
        }

        .prose blockquote {
            border-left: 4px solid var(--fallback-p, oklch(var(--p)));
            padding-left: 1rem;
            font-style: italic;
            opacity: 0.8;
            margin: 1.5rem 0;
        }
    </style>
</head>

<body class="bg-base-100 pb-20">

    <div class="navbar bg-base-300 shadow-sm px-4 lg:px-10 sticky top-0 z-50">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost text-xl text-primary font-bold">← Geri Dön</a>
        </div>
        <div class="navbar-center">
            <a href="index.html" class="btn btn-ghost text-xl font-bold uppercase">Z HABER</a>
        </div>
        <div class="navbar-end">
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="dark">
                <div class="swap-off">☀️</div>
                <div class="swap-on">☪</div>
            </label>
        </div>
    </div>

    <div class="container mx-auto mt-6 max-w-6xl px-4 grid grid-cols-1 lg:grid-cols-4 gap-8"
        id="article-detail-container">

        <div class="lg:col-span-3">
            <div class="card bg-base-100 shadow-xl overflow-hidden">
                <figure class="w-full h-64 lg:h-96 relative">
                    <img id="detail-image" src="" class="w-full h-full object-cover" alt="Haber Görseli">
                    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/70 to-transparent p-6">
                        <span id="detail-category" class="badge badge-primary mb-2">Kategori</span>
                        <h1 id="detail-title" class="text-3xl lg:text-4xl font-bold text-white leading-tight">...</h1>
                        <p id="detail-source" class="text-white/80 text-sm mt-2">Kaynak</p>
                    </div>
                </figure>

                <div class="card-body prose max-w-none lg:p-10" id="detail-content">
                    <div class="flex flex-col gap-4">
                        <div class="skeleton h-4 w-full"></div>
                        <div class="skeleton h-4 w-full"></div>
                        <div class="skeleton h-4 w-3/4"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-1 space-y-6">
            <div class="card bg-base-200 shadow-sm sticky top-24">
                <div class="card-body p-4">
                    <h3 class="font-bold text-lg mb-4 border-b pb-2 border-base-content/10">Bu Konuyla İlgili</h3>
                    <div id="related-news" class="flex flex-col gap-2">
                        <div class="skeleton h-20 w-full"></div>
                        <div class="skeleton h-20 w-full"></div>
                        <div class="skeleton h-20 w-full"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
